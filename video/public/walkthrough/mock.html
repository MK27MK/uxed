<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Symbol search · mock</title>
<style>
:root {
  color-scheme: dark;
  --gray-750: #262626;
  --gray-700: #333333;
  --up: #5fb27a;
  --down: #e0605a;
  --surface-hover: var(--gray-750);
  --foreground: #ededed;
  --foreground-muted: #b3b9c1;
  --foreground-subtle: #949ca7;
  --glass-background: rgb(18 22 28 / 0.58);
  --surface-raised: var(--glass-background);
  --glass-filter: blur(12px) saturate(1.1);
  --glass-border: rgb(221 233 255 / 0.16);
  --glass-shadow: inset 0 1px 0 rgb(255 255 255 / 0.05), 0 12px 32px rgb(0 0 0 / 0.28);
  --radius: 10px;
  --radius-small: 6px;
  --mono: ui-monospace, "Geist Mono", SFMono-Regular, Menlo, monospace;
}
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, #141b24, #0b0e12 55%, #12191d);
  color: var(--foreground);
  font-family: "Geist", system-ui, sans-serif;
  font-size: 13px;
}
button { cursor: pointer; font: inherit; }
:focus-visible { outline: 2px solid var(--foreground-muted); outline-offset: 2px; }

.dialog {
  width: calc(100vw - 32px); max-width: 640px; overflow: hidden;
  border: 1px solid var(--glass-border); border-radius: var(--radius);
  background: var(--surface-raised); backdrop-filter: var(--glass-filter); box-shadow: var(--glass-shadow);
}
.search {
  display: flex; align-items: center; gap: 10px; margin: 24px 24px 16px; padding: 0 12px 0 16px;
  border: 1px solid var(--glass-border); border-radius: var(--radius); color: var(--foreground-subtle);
}
.input {
  flex: 1; min-width: 0; padding: 14px 0; border: none; background: transparent;
  color: var(--foreground); font: inherit; font-size: 14px; outline: none;
}
.input::placeholder { color: var(--foreground-subtle); }
.key {
  padding: 2px 6px; border-radius: 4px; background: var(--gray-750); color: var(--foreground-muted);
  font-family: var(--mono); font-size: 11px;
}
.addStore { border: none; background: transparent; color: var(--foreground-muted); font-size: 16px; }

.segments {
  display: flex; margin: 12px 24px; padding: 3px;
  border: 1px solid var(--glass-border); border-radius: var(--radius); background: var(--surface-hover);
}
.segment {
  flex: 1 1 0; min-width: 0; padding: 10px 8px; border: none; border-radius: var(--radius-small);
  background: transparent; color: var(--foreground-muted); font-size: 13px;
}
.segment[aria-selected="true"] { background: var(--gray-700); color: var(--foreground); }

.filters { display: flex; gap: 4px; padding: 8px 24px; border-bottom: 1px solid var(--gray-750); }
.filter {
  padding: 3px 8px; border: none; border-radius: var(--radius-small); background: transparent;
  color: var(--foreground-muted); font-size: 12px;
}
.filter:hover { color: var(--foreground); }
.filter[aria-pressed="true"] { background: var(--gray-700); color: var(--foreground); }
.list { height: min(360px, 50vh); overflow-y: auto; padding: 6px 18px; }
.item {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: none;
  border-radius: var(--radius-small); background: transparent; color: var(--foreground-muted); text-align: left;
}
.item:hover, .item:focus-visible { background: var(--surface-hover); }
.ticker { min-width: 76px; color: var(--foreground); font-weight: 600; }
.badge {
  padding: 1px 6px; border: 1px solid var(--glass-border); border-radius: 4px;
  font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase;
}
.mono { font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; }
.timeframes { margin-left: auto; color: var(--foreground-subtle); }
.coverage { min-width: 76px; text-align: right; }
.footer {
  display: flex; justify-content: flex-end; gap: 14px; padding: 8px 12px;
  border-top: 1px solid var(--gray-750); color: var(--foreground-subtle); font-size: 11px;
}
.hint { display: inline-flex; align-items: center; gap: 6px; }

.store { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.message { padding: 12px; color: var(--foreground-subtle); font-size: 12px; text-align: center; }

.detail { min-height: min(560px, 72vh); max-height: min(640px, 72vh); overflow-y: auto; color: var(--foreground-muted); }
.detailHeader { display: flex; align-items: center; gap: 12px; padding: 24px 24px 8px; }
.detailHeader h2 { flex: 1; margin: 0; min-width: 0; color: var(--foreground); font-size: 18px; font-weight: 600; }
.iconButton {
  display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 6px;
  border: 1px solid var(--glass-border); border-radius: var(--radius-small); background: var(--surface-hover); color: var(--foreground);
}
.backButton { border-color: transparent; background: transparent; }
.runButton { border-radius: 50%; font-size: 13px; }
.configuration, .history { padding: 16px 24px 24px; }
.configuration h3 { color: var(--foreground); font-size: 14px; font-weight: 500; }
.description { min-height: 144px; box-sizing: border-box; padding: 16px; border: 1px solid var(--glass-border); border-radius: var(--radius); }
.description { display: flex; flex-direction: column; }
.description h3 { margin: 0 0 12px; }
.descriptionInput {
  flex: 1; min-height: 88px; margin: 0 -8px; padding: 6px 8px; resize: vertical; box-sizing: border-box;
  border: 1px solid transparent; border-radius: var(--radius-small); background: transparent;
  color: var(--foreground-muted); font: inherit; line-height: 1.5;
}
.descriptionInput:hover { border-color: var(--glass-border); }
.descriptionInput:focus { outline: none; border-color: var(--foreground-subtle); background: var(--surface-hover); color: var(--foreground); }
.descriptionInput::placeholder { color: var(--foreground-subtle); }
.descriptionActions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
.textButton {
  padding: 5px 10px; border: 1px solid var(--glass-border); border-radius: var(--radius-small);
  background: var(--surface-hover); color: var(--foreground); font-size: 12px;
}
.textButton.quiet { border-color: transparent; background: transparent; color: var(--foreground-muted); }
.parametersHeading { margin: 24px 0 20px; }
.parameterFields { display: grid; gap: 20px; }
.parameter { display: grid; grid-template-columns: minmax(0, 180px) minmax(0, 112px); align-items: center; gap: 6px 16px; }
.parameter label { color: var(--foreground); font-family: var(--mono); }
.numberControl { display: flex; min-width: 0; }
.numberControl input, .parameter select, .sort select {
  width: 100%; min-width: 0; padding: 6px 10px; border: 1px solid var(--glass-border); border-radius: var(--radius-small);
  background: var(--surface-hover); color: var(--foreground); font: inherit; box-sizing: border-box;
}
.numberControl input { border-right: none; border-radius: var(--radius-small) 0 0 var(--radius-small); }
.parameter input[aria-invalid="true"], .parameter small { color: var(--down); }
.parameter small { grid-column: 2; }
.stepper { display: flex; flex-direction: column; flex: 0 0 28px; }
.stepper button {
  flex: 1; min-height: 16px; padding: 0; border: 1px solid var(--glass-border); background: var(--surface-hover);
  color: var(--foreground); line-height: 1; font-size: 10px;
}
.stepper button:first-child { border-radius: 0 var(--radius-small) 0 0; }
.stepper button:last-child { border-top: none; border-radius: 0 0 var(--radius-small) 0; }

.sort { display: flex; align-items: center; gap: 8px; width: fit-content; margin: 0 0 20px auto; }
.sort select { max-width: 160px; }
.run {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 16px;
  padding: 16px 8px; border-bottom: 1px solid var(--glass-border); color: var(--foreground-muted);
}
.run:first-of-type { border-top: 1px solid var(--glass-border); }
.run time { color: var(--foreground); }
.pnl { font-size: 13px; }
.pnl.up { color: var(--up); }
.pnl.down { color: var(--down); }
.runParams { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; color: var(--foreground-subtle); }
.version { margin-top: 6px; font-size: 11px; color: var(--foreground-subtle); }
.status { margin: 0 24px 16px; padding: 10px 12px; border: 1px solid var(--glass-border); border-radius: var(--radius-small); font-size: 12px; }
[hidden] { display: none !important; }

@media (max-width: 420px) {
  .search { margin: 16px 16px 12px; }
  .segments { margin: 12px 16px; }
  .detailHeader { padding: 20px 16px 8px; }
  .configuration, .history { padding: 14px 16px 20px; }
  .parameter { grid-template-columns: minmax(0, 1fr) 104px; gap: 6px 12px; }
  .coverage { display: none; }
}
</style>
</head>
<body>
<main data-mock-root="SymbolSearch">
<div class="dialog" role="dialog" aria-label="Symbol Search" data-ui="dialog">

  <div id="browse">
    <div class="search" data-ui="search-field">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="6" r="4"/><path d="M9 9l3 3"/></svg>
      <input id="query" class="input" maxlength="20" placeholder="Search symbols…" aria-label="Search" data-ui="search-input">
      <button type="button" class="addStore" id="add-store" aria-label="Add market data store" data-ui="add-store" data-oos="Opens the market data store picker">+</button>
      <kbd class="key">Esc</kbd>
    </div>

    <div class="segments" role="tablist" aria-label="Search category" data-ui="category-tabs">
      <button type="button" class="segment" role="tab" aria-selected="true" data-tab="symbols" data-ui="category-tab">Symbols</button>
      <button type="button" class="segment" role="tab" aria-selected="false" data-tab="strategies" data-ui="category-tab">Strategies</button>
    </div>

    <section id="symbols-pane" data-ui="symbols-pane">
      <div class="filters" role="group" aria-label="Asset type" data-ui="asset-filters">
        <button type="button" class="filter" aria-pressed="true" data-filter="" data-ui="asset-filter">All</button>
        <button type="button" class="filter" aria-pressed="false" data-filter="stock" data-ui="asset-filter">Stocks</button>
        <button type="button" class="filter" aria-pressed="false" data-filter="future" data-ui="asset-filter">Futures</button>
        <button type="button" class="filter" aria-pressed="false" data-filter="crypto" data-ui="asset-filter">Crypto</button>
        <button type="button" class="filter" aria-pressed="false" data-filter="fx" data-ui="asset-filter">FX</button>
      </div>
      <div class="list" id="symbol-list"></div>
      <div class="footer">
        <span class="hint"><kbd class="key">Tab</kbd>Filters</span>
        <span class="hint"><kbd class="key">↑↓</kbd>Navigate</span>
        <span class="hint"><kbd class="key">↵</kbd>Open</span>
      </div>
    </section>

    <section id="strategies-pane" hidden data-ui="strategies-pane">
      <div class="list" id="strategy-list"></div>
    </section>
  </div>

  <section id="detail" class="detail" hidden data-ui="strategy-detail">
    <div class="detailHeader">
      <button type="button" class="iconButton backButton" id="back" aria-label="Back to strategies" data-ui="back-button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
      </button>
      <h2 id="detail-name" data-ui="strategy-title"></h2>
      <button type="button" class="iconButton runButton" id="run" aria-label="Run" title="Run backtest" data-ui="run-button" data-oos="Runs a backtest with the current parameters and saves it as a past run">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 11 7-11 7Z"/></svg>
      </button>
    </div>

    <div class="segments" role="tablist" aria-label="Strategy details" data-ui="detail-tabs">
      <button type="button" class="segment" role="tab" aria-selected="true" data-detail-tab="configuration" data-ui="detail-tab">Configuration</button>
      <button type="button" class="segment" role="tab" aria-selected="false" data-detail-tab="history" data-ui="detail-tab">Past runs</button>
    </div>

    <div id="configuration" class="configuration">
      <section class="description" aria-label="Description" data-ui="description">
        <h3><label for="detail-description">Description</label></h3>
        <textarea id="detail-description" class="descriptionInput" rows="4" placeholder="No description provided. Click to write one." data-ui="description-input"></textarea>
        <div class="descriptionActions" id="description-actions" hidden>
          <button type="button" class="textButton quiet" id="description-revert" data-ui="description-revert">Revert</button>
          <button type="button" class="textButton" id="description-save" data-ui="description-save" data-oos="Writes the description back into the strategy's docstring in its .py file">Save to file</button>
        </div>
      </section>
      <h3 class="parametersHeading">Parameters</h3>
      <div class="parameterFields" id="parameter-fields" data-ui="parameter-fields"></div>
    </div>

    <div id="history" class="history" hidden>
      <div class="sort" data-ui="run-sort">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h11M4 18h6"/></svg>
        <select id="sort" aria-label="Sort past runs">
          <option value="time">Ending time</option>
          <option value="pnl">Final P&amp;L</option>
        </select>
      </div>
      <div id="run-list"></div>
    </div>
  </section>
</div>
</main>
<script>
const SYMBOLS = [
  { ticker: "ES", type: "future", store: "firstrate", tf: ["1m", "5m", "1h", "1D"], from: "2008", to: "2026" },
  { ticker: "NQ", type: "future", store: "firstrate", tf: ["1m", "5m", "1h", "1D"], from: "2008", to: "2026" },
  { ticker: "AAPL", type: "stock", store: "firstrate", tf: ["1m", "1D"], from: "2005", to: "2026" },
  { ticker: "MSFT", type: "stock", store: "local-csv", tf: ["1D"], from: "2010", to: "2026" },
  { ticker: "BTCUSD", type: "crypto", store: "binance", tf: ["1m", "1h"], from: "2017", to: "2026" },
  { ticker: "EURUSD", type: "fx", store: "dukascopy", tf: ["1m", "1h", "1D"], from: "2003", to: "2026" },
];
const STRATEGIES = [
  {
    name: "bollinger_bands", path: "strategies/bollinger_bands.py",
    description: "Mean reversion on Bollinger Bands.\nGoes long when the close crosses back above the lower band, exits at the middle band.",
    params: [{ name: "bb_len", type: "integer", value: "20", step: 1, min: 2 }, { name: "bb_dev", type: "number", value: "2.0", step: 0.1, min: 0.1 }, { name: "allow_short", type: "boolean", value: "false" }],
    runs: [
      { ended: "2026-10-14T09:42:00", pnl: 12480.5, params: { bb_len: 20, bb_dev: 2.0, allow_short: false }, version: "Current version" },
      { ended: "2026-10-13T18:15:00", pnl: -3120.0, params: { bb_len: 14, bb_dev: 1.5, allow_short: true }, version: "Current version" },
      { ended: "2026-10-11T11:03:00", pnl: 8790.25, params: { bb_len: 30, bb_dev: 2.5, allow_short: false }, version: "Previous version" },
    ],
  },
  {
    name: "sma_cross", path: "strategies/sma_cross.py",
    description: "Classic fast/slow simple moving average crossover.",
    params: [{ name: "fast", type: "integer", value: "10", step: 1, min: 1 }, { name: "slow", type: "integer", value: "50", step: 1, min: 2 }],
    runs: [{ ended: "2026-10-12T16:20:00", pnl: 4210.0, params: { fast: 10, slow: 50 }, version: "Current version" }],
  },
  { name: "opening_range_breakout", path: "strategies/orb.py", description: "", params: [{ name: "range_minutes", type: "integer", value: "30", step: 5, min: 5 }], runs: [] },
  { name: "rsi_divergence", path: "strategies/rsi_divergence.py", description: "Trades regular RSI divergences on swing pivots.", params: [{ name: "rsi_len", type: "integer", value: "14", step: 1, min: 2 }, { name: "pivot", type: "integer", value: "5", step: 1, min: 1 }], runs: [] },
];

const state = { tab: "symbols", filter: "", queries: { symbols: "", strategies: "" }, strategy: null, detailTab: "configuration", sort: "time", drafts: {} };
const $ = id => document.getElementById(id);
const esc = text => String(text).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const money = value => `${value < 0 ? "−" : "+"}$${Math.abs(value).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

function renderSymbols() {
  const q = state.queries.symbols.toLowerCase();
  const rows = SYMBOLS.filter(s => (!state.filter || s.type === state.filter) && s.ticker.toLowerCase().includes(q));
  $("symbol-list").innerHTML = rows.length ? rows.map(s => `
    <button type="button" class="item" data-ui="symbol-row" data-oos="Loads ${s.ticker} into the chart">
      <span class="ticker">${s.ticker}</span><span class="badge">${s.type}</span><span>${s.store}</span>
      <span class="mono timeframes">${s.tf.join(" · ")}</span><span class="mono coverage">${s.from}–${s.to}</span>
    </button>`).join("") : `<div class="message">No symbols found.</div>`;
}

function renderStrategies() {
  const q = state.queries.strategies.toLowerCase();
  const rows = STRATEGIES.filter(s => `${s.name} ${s.path}`.toLowerCase().includes(q));
  $("strategy-list").innerHTML = rows.length ? rows.map(s => `
    <button type="button" class="item" data-strategy="${s.name}" data-ui="strategy-row">
      <span class="ticker">${s.name}</span><span class="badge">py</span><span class="store">${s.path}</span>
      <span class="mono timeframes">${s.params.length} param${s.params.length === 1 ? "" : "s"}</span><span class="mono coverage">${s.runs.length} run${s.runs.length === 1 ? "" : "s"}</span>
    </button>`).join("") : `<div class="message">No strategies found in ~/.komplex/strategies.</div>`;
}

function parameterError(field, value) {
  if (field.type === "boolean") return null;
  const n = Number(value);
  if (value.trim() === "" || Number.isNaN(n)) return "Enter a number.";
  if (field.type === "integer" && !Number.isInteger(n)) return "Enter a whole number.";
  if (n < field.min) return `Must be at least ${field.min}.`;
  return null;
}

function renderDescriptionActions() {
  $("description-actions").hidden = state.descriptionDraft === state.strategy.description;
}

function renderParameters() {
  const s = state.strategy;
  $("parameter-fields").innerHTML = s.params.map(f => {
    const value = state.drafts[f.name];
    const id = `param-${f.name}`;
    if (f.type === "boolean") return `<div class="parameter" data-ui="parameter"><label for="${id}">${f.name}</label>
      <select id="${id}" data-param="${f.name}"><option value="true"${value === "true" ? " selected" : ""}>True</option><option value="false"${value === "false" ? " selected" : ""}>False</option></select></div>`;
    const error = parameterError(f, value);
    return `<div class="parameter" data-ui="parameter"><label for="${id}">${f.name}</label>
      <div class="numberControl"><input id="${id}" data-param="${f.name}" inputmode="${f.type === "integer" ? "numeric" : "decimal"}" value="${esc(value)}" aria-invalid="${Boolean(error)}">
      <div class="stepper"><button type="button" data-step="1" data-param="${f.name}" aria-label="Increase ${f.name}" data-ui="parameter-stepper">▲</button><button type="button" data-step="-1" data-param="${f.name}" aria-label="Decrease ${f.name}" data-ui="parameter-stepper">▼</button></div></div>
      ${error ? `<small role="alert">${error}</small>` : ""}</div>`;
  }).join("");
  const invalid = s.params.some(f => parameterError(f, state.drafts[f.name]));
  $("run").disabled = invalid;
  $("run").title = invalid ? "Correct the parameters before running" : "Run backtest";
}

function renderRuns() {
  const runs = [...state.strategy.runs].sort((a, b) => state.sort === "pnl" ? b.pnl - a.pnl : b.ended.localeCompare(a.ended));
  $("run-list").innerHTML = runs.length ? runs.map(r => `
    <article class="run" data-ui="run-row">
      <div>
        <time datetime="${r.ended}">${new Date(r.ended).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" })}</time>
        <div class="mono runParams">${Object.entries(r.params).map(([k, v]) => `<span>${k}: ${JSON.stringify(v)}</span>`).join("")}</div>
        <div class="version">${r.version}</div>
      </div>
      <span class="mono pnl ${r.pnl < 0 ? "down" : "up"}">${money(r.pnl)}</span>
      <button type="button" class="iconButton" aria-label="Add equity to the chart" title="Add equity to the chart" data-ui="add-equity" data-oos="Adds this run's equity curve to the focused chart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m6 16 4-7 4 5 4-6"/></svg>
      </button>
    </article>`).join("") : `<div class="message">No past runs. Press ▶ to run a backtest.</div>`;
}

function render() {
  const inDetail = Boolean(state.strategy);
  $("browse").hidden = inDetail;
  $("detail").hidden = !inDetail;
  if (inDetail) {
    $("detail-name").textContent = state.strategy.name;
    $("detail-description").value = state.descriptionDraft;
    renderDescriptionActions();
    document.querySelectorAll("[data-detail-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.detailTab === state.detailTab));
    $("configuration").hidden = state.detailTab !== "configuration";
    $("history").hidden = state.detailTab !== "history";
    $("sort").value = state.sort;
    renderParameters();
    renderRuns();
    return;
  }
  document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === state.tab));
  $("symbols-pane").hidden = state.tab !== "symbols";
  $("strategies-pane").hidden = state.tab !== "strategies";
  $("add-store").hidden = state.tab !== "symbols";
  $("query").placeholder = state.tab === "strategies" ? "Search strategies…" : "Search symbols…";
  $("query").value = state.queries[state.tab];
  document.querySelectorAll("[data-filter]").forEach(b => b.setAttribute("aria-pressed", b.dataset.filter === state.filter));
  renderSymbols();
  renderStrategies();
}

function openStrategy(name) {
  state.strategy = STRATEGIES.find(s => s.name === name);
  state.detailTab = "configuration";
  state.drafts = Object.fromEntries(state.strategy.params.map(f => [f.name, f.value]));
  state.descriptionDraft = state.strategy.description;
  render();
  $("back").focus();
}

function step(name, direction) {
  const f = state.strategy.params.find(p => p.name === name);
  const current = Number(state.drafts[name]);
  if (Number.isNaN(current)) return;
  const next = Math.max(f.min, current + direction * f.step);
  state.drafts[name] = f.type === "integer" ? String(Math.round(next)) : next.toFixed(1);
}

document.addEventListener("click", event => {
  const tab = event.target.closest("[data-tab]");
  if (tab) { state.tab = tab.dataset.tab; render(); $("query").focus(); return; }
  const filter = event.target.closest("[data-filter]");
  if (filter) { state.filter = filter.dataset.filter; render(); return; }
  const strategy = event.target.closest("[data-strategy]");
  if (strategy) { openStrategy(strategy.dataset.strategy); return; }
  const detailTab = event.target.closest("[data-detail-tab]");
  if (detailTab) { state.detailTab = detailTab.dataset.detailTab; render(); return; }
  const stepper = event.target.closest("[data-step]");
  if (stepper) { step(stepper.dataset.param, Number(stepper.dataset.step)); renderParameters(); return; }
  if (event.target.closest("#description-revert")) { state.descriptionDraft = state.strategy.description; render(); return; }
  if (event.target.closest("#back")) { state.strategy = null; render(); $("query").focus(); }
});

$("query").addEventListener("input", event => { state.queries[state.tab] = event.target.value; renderSymbols(); renderStrategies(); });
$("detail-description").addEventListener("input", event => { state.descriptionDraft = event.target.value; renderDescriptionActions(); });
$("sort").addEventListener("change", event => { state.sort = event.target.value; renderRuns(); });
$("parameter-fields").addEventListener("change", event => {
  const name = event.target.dataset.param;
  if (name) { state.drafts[name] = event.target.value; renderParameters(); }
});
$("parameter-fields").addEventListener("keydown", event => {
  const name = event.target.dataset.param;
  if (!name || event.target.tagName !== "INPUT" || !["ArrowUp", "ArrowDown"].includes(event.key)) return;
  event.preventDefault();
  step(name, event.key === "ArrowUp" ? 1 : -1);
  renderParameters();
  $(`param-${name}`).focus();
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape" && event.target.id === "detail-description") { event.target.blur(); return; }
  if (event.key === "Escape" && state.strategy) { state.strategy = null; render(); $("query").focus(); }
});

const DETAIL_IDS = ["strategy-detail", "back-button", "strategy-title", "run-button", "detail-tabs", "detail-tab", "description", "description-input", "description-revert", "description-save", "parameter-fields", "parameter", "parameter-stepper"];
const HISTORY_IDS = ["run-sort", "run-row", "add-equity"];
const DRAFT_IDS = ["description-revert", "description-save"];

window.mockReveal = id => {
  if (![...DETAIL_IDS, ...HISTORY_IDS].includes(id)) {
    state.strategy = null;
    state.tab = ["strategies-pane", "strategy-row"].includes(id) ? "strategies" : "symbols";
    render();
    return;
  }
  openStrategy(STRATEGIES.find(s => s.runs.length).name);
  state.detailTab = HISTORY_IDS.includes(id) ? "history" : "configuration";
  if (DRAFT_IDS.includes(id)) state.descriptionDraft += " (edited)";
  render();
};

render();
</script>
